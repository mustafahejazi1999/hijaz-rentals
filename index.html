<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;

const storage = {
  async get(key) {
    try {
      const { db, ref, get } = window.__firebase;
      const snap = await get(ref(db, key));
      if (!snap.exists()) return null;
      return { key, value: snap.val() };
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      const { db, ref, set } = window.__firebase;
      await set(ref(db, key), value);
      return { key, value };
    } catch (e) { return null; }
  },
};

function useFirebaseReady() {
  const [ready, setReady] = useState(!!window.__firebase);
  useEffect(() => {
    if (window.__firebase) { setReady(true); return; }
    const id = setInterval(() => {
      if (window.__firebase) { setReady(true); clearInterval(id); }
    }, 50);
    return () => clearInterval(id);
  }, []);
  return ready;
}

// كل إيميل مرتبط بدور، وبمحفظة (عدا صاحب المنصة اللي بيشوف كل المحافظ).
// عدّلي الإيميلات هون لتطابق الحسابات اللي بتسويها بـ Firebase Authentication.
// صاحب المنصة (superadmin): يشوف قائمة كل العملاء/المحافظ، وبقدر يضيف عميل جديد،
// وبقدر يفوت لأي محفظة بصلاحية كاملة.
// كل عميل (محفظة) إله admin (صلاحية كاملة داخل محفظته بس)، owner (يشوف بس)،
// staff (يشوف المتأخرين بس).
const DEFAULT_PORTFOLIO_ID = "hijaz";
const DEFAULT_STORAGE_KEY = "hijaz-rentals-store-v7";
const PORTFOLIOS_KEY = "hijaz-rentals-portfolios";

const ROLES_KEY = "hijaz-rentals-roles";
function defaultRolesSeed() {
  return {
    "hejazimustafa65@gmail.com": { role: "superadmin" },
    "waleed@tdco.sa": { role: "owner", portfolio: "hijaz" },
    "abufares@gmail.com": { role: "staff", portfolio: "hijaz" },
  };
}
async function loadRolesMap() {
  let map;
  try {
    const res = await storage.get(ROLES_KEY);
    map = res && res.value ? JSON.parse(res.value) : null;
  } catch (e) {
    map = null;
  }
  if (!map || typeof map !== "object" || Object.keys(map).length === 0) {
    map = defaultRolesSeed();
    try { await storage.set(ROLES_KEY, JSON.stringify(map)); } catch (e) {}
  }
  return map;
}
async function saveRolesMap(map) {
  await storage.set(ROLES_KEY, JSON.stringify(map));
}
async function addPortfolioUser(email, password, role, portfolioId) {
  const cleanEmail = String(email || "").trim().toLowerCase();
  const { secondaryAuth, createUserWithEmailAndPassword, signOut } = window.__firebase;
  await createUserWithEmailAndPassword(secondaryAuth, cleanEmail, password);
  await signOut(secondaryAuth); // ينضف جلسة الحساب التاني، ما بيأثر على تسجيل دخولك إنتِ
  const map = await loadRolesMap();
  map[cleanEmail] = { role, portfolio: portfolioId };
  await saveRolesMap(map);
  return map;
}
async function removePortfolioUser(email) {
  const map = await loadRolesMap();
  delete map[String(email || "").trim().toLowerCase()];
  await saveRolesMap(map);
  return map;
}

function roleForEmail(email, rolesMap) {
  return (rolesMap && rolesMap[(email || "").toLowerCase()]) || null;
}
function storageKeyForPortfolio(id) {
  return id === DEFAULT_PORTFOLIO_ID ? DEFAULT_STORAGE_KEY : `hijaz-rentals-store-v7__${id}`;
}
function slugify(name) {
  const base = String(name || "").trim().replace(/[^ \u0600-\u06FFa-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return (base || "portfolio") + "-" + Math.random().toString(36).slice(2, 7);
}
function emptyPortfolioStore() {
  return {
    building1: { name: "العمارة الأولى", rooms: [] },
    building2: { name: "العمارة الثانية", rooms: [] },
  };
}

function NoAccessScreen({ email, onLogout }) {
  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: "#F6F2EA", fontFamily: "'Tajawal', 'Segoe UI', Tahoma, sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 360, border: "1px solid #E4DBC8", textAlign: "center" }}>
        <div style={{ fontSize: 30, marginBottom: 10 }}>🚫</div>
        <div style={{ fontWeight: 800, fontSize: 15, color: "#12312D", marginBottom: 6 }}>ما في صلاحية لهذا الحساب</div>
        <div style={{ fontSize: 12.5, color: "#71685C", marginBottom: 18 }}>الحساب {email} مش مربوط بأي دور بالنظام. تواصلي مع مسؤول المنصة لإضافته.</div>
        <button onClick={onLogout} style={{ width: "100%", padding: "10px", borderRadius: 9, border: "1px solid #E4DBC8", background: "#fff", color: "#12312D", fontWeight: 700, fontSize: 13.5 }}>تسجيل خروج</button>
      </div>
    </div>
  );
}

async function loadPortfolios() {
  let list;
  try {
    const res = await storage.get(PORTFOLIOS_KEY);
    list = res && res.value ? JSON.parse(res.value) : null;
  } catch (e) {
    list = null;
  }
  if (!list || !Array.isArray(list) || list.length === 0) {
    list = [{ id: DEFAULT_PORTFOLIO_ID, name: "عمارات الحجاز" }];
    try { await storage.set(PORTFOLIOS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  return list;
}

function PortfolioListScreen({ onEnter, onLogout }) {
  const [portfolios, setPortfolios] = useState(null);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    loadPortfolios().then(setPortfolios);
  }, []);

  async function addPortfolio() {
    if (!newName.trim() || busy) return;
    setBusy(true);
    const id = slugify(newName);
    const key = storageKeyForPortfolio(id);
    try {
      await storage.set(key, JSON.stringify(emptyPortfolioStore()));
      const next = [...(portfolios || []), { id, name: newName.trim() }];
      await storage.set(PORTFOLIOS_KEY, JSON.stringify(next));
      setPortfolios(next);
      setAdding(false);
      setNewName("");
    } catch (e) {
      window.alert("تعذّر إضافة العميل — تحققي من الاتصال بالإنترنت.");
    }
    setBusy(false);
  }

  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: "#F6F2EA", fontFamily: "'Tajawal', 'Segoe UI', Tahoma, sans-serif" }}>
      <div style={{ background: "#12312D", padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div style={{ color: "#fff", fontWeight: 900, fontSize: 16 }}>عقارك</div>
          <div style={{ color: "#C9CFC7", fontSize: 11.5 }}>قائمة العملاء — صاحب المنصة</div>
        </div>
        <button onClick={onLogout} style={{ background: "rgba(255,255,255,0.12)", border: "none", borderRadius: 8, padding: "8px 12px", color: "#fff", fontSize: 12.5, fontWeight: 700 }}>تسجيل خروج</button>
      </div>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "22px 16px 60px" }}>
        {!adding ? (
          <button onClick={() => setAdding(true)} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: "#1D4B45", color: "#fff", fontWeight: 700, fontSize: 14, marginBottom: 18 }}>
            + إضافة عميل جديد
          </button>
        ) : (
          <div style={{ background: "#fff", border: "1px solid #E4DBC8", borderRadius: 12, padding: 14, marginBottom: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#71685C", marginBottom: 6 }}>اسم العميل / المحفظة</div>
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="مثال: عمارات الرياض" style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #E4DBC8", fontSize: 13.5, marginBottom: 10 }} />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={addPortfolio} disabled={!newName.trim() || busy} style={{ flex: 1, padding: "10px", borderRadius: 9, border: "none", background: "#1D4B45", color: "#fff", fontWeight: 700, fontSize: 13, opacity: (!newName.trim() || busy) ? 0.6 : 1 }}>
                {busy ? "جارٍ الإضافة..." : "إضافة"}
              </button>
              <button onClick={() => { setAdding(false); setNewName(""); }} style={{ padding: "10px 16px", borderRadius: 9, border: "1px solid #E4DBC8", background: "#fff", color: "#71685C", fontWeight: 700, fontSize: 13 }}>إلغاء</button>
            </div>
          </div>
        )}

        {portfolios === null ? (
          <div style={{ color: "#71685C", fontSize: 13, textAlign: "center" }}>...جاري التحميل</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {portfolios.map((p) => (
              <button key={p.id} onClick={() => onEnter(p)} style={{
                display: "flex", alignItems: "center", gap: 12, textAlign: "right",
                background: "#fff", border: "1px solid #E4DBC8", borderRadius: 12, padding: "14px 16px", cursor: "pointer",
              }}>
                <div style={{ width: 40, height: 40, borderRadius: 10, background: "#F6F2EA", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🏢</div>
                <div style={{ flex: 1, fontWeight: 800, fontSize: 14, color: "#12312D" }}>{p.name}</div>
                <div style={{ fontSize: 16, color: "#B8AF9C" }}>‹</div>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function RoleSelectScreen({ onPick }) {
  return (
    <div dir="rtl" style={{ minHeight: "100vh", position: "relative", overflow: "hidden", background: "linear-gradient(160deg, #F6F2EA 0%, #EFE7D6 100%)", fontFamily: "'Tajawal', 'Segoe UI', Tahoma, sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{
        position: "absolute", inset: 0, backgroundImage: `url(${BUILDING_PHOTO})`,
        backgroundSize: "cover", backgroundPosition: "center", opacity: 0.14, filter: "grayscale(20%)",
      }} />
      <div style={{ width: "100%", maxWidth: 380, textAlign: "center", position: "relative", zIndex: 1 }}>
        <div style={{
          width: 68, height: 68, borderRadius: 18, background: "#1D4B45",
          display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px", fontSize: 32,
          boxShadow: "0 8px 20px rgba(20,40,35,0.18)",
        }}>🏢</div>
        <div style={{ fontWeight: 900, fontSize: 28, color: "#12312D", marginBottom: 8 }}>عقارك</div>
        <div style={{ fontSize: 14, color: "#5B6864", marginBottom: 34, lineHeight: 1.6 }}>نظام إدارة إيجارات ذكي لعقاراتك — تابعي مستأجريك واستحقاقاتك وتقاريرك بمكان واحد</div>
        <button
          onClick={() => onPick({ id: "login", label: "" })}
          style={{
            width: "100%", padding: "15px", borderRadius: 12, border: "none",
            background: "#1D4B45", color: "#fff", fontWeight: 800, fontSize: 15,
            boxShadow: "0 6px 16px rgba(20,40,35,0.18)", cursor: "pointer",
          }}
        >
          تسجيل الدخول
        </button>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, error, busy, roleLabel, onBack }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  return (
    <div dir="rtl" style={{ minHeight: "100vh", position: "relative", overflow: "hidden", background: "#F6F2EA", fontFamily: "'Tajawal', 'Segoe UI', Tahoma, sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{
        position: "absolute", inset: 0, backgroundImage: `url(${BUILDING_PHOTO})`,
        backgroundSize: "cover", backgroundPosition: "center", opacity: 0.14, filter: "grayscale(20%)",
      }} />
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 360, border: "1px solid #E4DBC8", position: "relative", zIndex: 1 }}>
        {onBack && (
          <button onClick={onBack} style={{ background: "none", border: "none", padding: 0, marginBottom: 14, color: "#71685C", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
            › رجوع للرئيسية
          </button>
        )}
        <div style={{ fontWeight: 900, fontSize: 18, color: "#12312D", marginBottom: 4 }}>عقارك</div>
        <div style={{ fontSize: 12.5, color: "#71685C", marginBottom: 20 }}>{roleLabel ? `تسجيل دخول — ${roleLabel}` : "سجّلي دخول للمتابعة"}</div>
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 11.5, color: "#71685C", marginBottom: 4, fontWeight: 600 }}>البريد الإلكتروني</div>
          <input value={email} onChange={(e) => setEmail(e.target.value)} type="email" style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #E4DBC8", fontSize: 13.5 }} />
        </div>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11.5, color: "#71685C", marginBottom: 4, fontWeight: 600 }}>كلمة السر</div>
          <input value={password} onChange={(e) => setPassword(e.target.value)} type="password" style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #E4DBC8", fontSize: 13.5 }}
            onKeyDown={(e) => { if (e.key === "Enter") onLogin(email, password); }} />
        </div>
        {error && <div style={{ color: "#A6402F", fontSize: 12, marginBottom: 10 }}>{error}</div>}
        <button
          onClick={() => onLogin(email, password)}
          disabled={busy || !email || !password}
          style={{ width: "100%", padding: "11px", borderRadius: 9, border: "none", background: "#1D4B45", color: "#fff", fontWeight: 700, fontSize: 14, opacity: busy ? 0.7 : 1 }}
        >
          {busy ? "جارٍ الدخول..." : "دخول"}
        </button>
      </div>
    </div>
  );
}

function AuthGate() {
  const fbReady = useFirebaseReady();
  const [user, setUser] = useState(undefined); // undefined = checking, null = signed out
  const [loginError, setLoginError] = useState("");
  const [busy, setBusy] = useState(false);
  const [pickedRole, setPickedRole] = useState(null); // which role card the person clicked (cosmetic only)
  const [enteredPortfolio, setEnteredPortfolio] = useState(null); // superadmin: which client they're currently viewing
  const [rolesMap, setRolesMap] = useState(null); // undefined-ish until loaded
  const [portfoliosList, setPortfoliosList] = useState(null);

  useEffect(() => {
    if (!fbReady) return;
    const { auth, onAuthStateChanged } = window.__firebase;
    const unsub = onAuthStateChanged(auth, (u) => setUser(u || null));
    return () => unsub && unsub();
  }, [fbReady]);

  useEffect(() => {
    if (!user) return;
    let cancelled = false;
    loadRolesMap().then((map) => { if (!cancelled) setRolesMap(map); });
    loadPortfolios().then((list) => { if (!cancelled) setPortfoliosList(list); });
    return () => { cancelled = true; };
  }, [user]);

  async function handleLogin(email, password) {
    setBusy(true);
    setLoginError("");
    try {
      const { auth, signInWithEmailAndPassword } = window.__firebase;
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      setLoginError("الإيميل أو كلمة السر غير صحيحة.");
    }
    setBusy(false);
  }

  function handleLogout() {
    const { auth, signOut } = window.__firebase;
    signOut(auth);
    setPickedRole(null);
    setEnteredPortfolio(null);
    setRolesMap(null);
  }

  if (!fbReady || user === undefined) {
    return (
      <div style={{ minHeight: "100vh", background: "#F6F2EA", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Tajawal', 'Segoe UI', Tahoma, sans-serif" }}>
        <div style={{ color: "#20302E", fontSize: 15 }}>...جاري التحقق</div>
      </div>
    );
  }

  if (!user) {
    if (!pickedRole) {
      return <RoleSelectScreen onPick={(r) => setPickedRole(r)} />;
    }
    return <LoginScreen onLogin={handleLogin} error={loginError} busy={busy} roleLabel={pickedRole.label} onBack={() => setPickedRole(null)} />;
  }

  if (!rolesMap) {
    return (
      <div style={{ minHeight: "100vh", background: "#F6F2EA", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Tajawal', 'Segoe UI', Tahoma, sans-serif" }}>
        <div style={{ color: "#20302E", fontSize: 15 }}>...جاري التحقق</div>
      </div>
    );
  }

  const assignment = roleForEmail(user.email, rolesMap);
  if (!assignment) {
    return <NoAccessScreen email={user.email} onLogout={handleLogout} />;
  }

  const reloadRoles = () => loadRolesMap().then(setRolesMap);

  if (assignment.role === "superadmin") {
    if (!enteredPortfolio) {
      return <PortfolioListScreen onEnter={(p) => setEnteredPortfolio(p)} onLogout={handleLogout} />;
    }
    return (
      <App
        onLogout={handleLogout}
        role="admin"
        storageKey={storageKeyForPortfolio(enteredPortfolio.id)}
        portfolioId={enteredPortfolio.id}
        portfolioName={enteredPortfolio.name}
        onBackToPortfolios={() => setEnteredPortfolio(null)}
        rolesMap={rolesMap}
        onRolesChanged={reloadRoles}
      />
    );
  }

  return (
    <App
      onLogout={handleLogout}
      role={assignment.role}
      storageKey={storageKeyForPortfolio(assignment.portfolio)}
      portfolioId={assignment.portfolio}
      portfolioName={(portfoliosList || []).find((p) => p.id === assignment.portfolio)?.name || "عقارك"}
      rolesMap={rolesMap}
      onRolesChanged={reloadRoles}
    />
  );
}

function todayStr() {
  const d = new Date();
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}

function fmtMoney(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("en-US", { maximumFractionDigits: 0 }) + " ر.س";
}

function fmtDate(s) {
  if (!s) return "—";
  return s;
}

const AR_MONTH_NAMES = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const AR_ORDINALS = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر", "الحادي عشر", "الثاني عشر"];

function monthLabelAr(ym) {
  if (!ym || ym.length < 7) return ym || "—";
  const [y, m] = ym.split("-");
  const idx = parseInt(m, 10) - 1;
  return `${AR_MONTH_NAMES[idx] || m} ${y}`;
}

function ordinalMonthLabel(idx) {
  return idx < AR_ORDINALS.length ? `الشهر ${AR_ORDINALS[idx]}` : `الشهر رقم ${idx + 1}`;
}

function buildMonthlyBreakdown(room) {
  const entries = room.payments || [];
  const groupMap = {};
  entries.forEach((p) => {
    let key;
    if (p.monthSeq !== undefined && p.monthSeq !== null) {
      key = `seq-${p.monthSeq}`;
    } else if (p.date && p.date.length >= 7) {
      key = `ym-${p.date.slice(0, 7)}`;
    } else {
      return;
    }
    if (!groupMap[key]) groupMap[key] = { charge: 0, cash: 0, transfer: 0, platform: 0, receipts: [], chargeDate: null, payDates: [], seq: p.monthSeq };
    if (p.type === "charge") {
      groupMap[key].charge += Number(p.amount) || 0;
      // The charge's own date is the true due month for this block. Keep
      // it separate from payment dates below — a late payment must not
      // make the block look like it belongs to a different month.
      if (p.date && !groupMap[key].chargeDate) groupMap[key].chargeDate = p.date;
    } else if (p.type === "payment") {
      groupMap[key].cash += Number(p.cash) || 0;
      groupMap[key].transfer += Number(p.transfer) || 0;
      groupMap[key].platform += Number(p.platform) || 0;
      if (p.receipt) groupMap[key].receipts.push(String(p.receipt));
      if (p.date) groupMap[key].payDates.push(p.date);
    }
  });

  const items = Object.keys(groupMap).map((key) => {
    const g = groupMap[key];
    const repDate = g.chargeDate || g.payDates.slice().sort()[0] || (key.startsWith("ym-") ? key.slice(3) + "-01" : "");
    return { key, g, repDate };
  });

  items.sort((a, b) => {
    if (a.g.seq !== undefined && b.g.seq !== undefined) return a.g.seq - b.g.seq;
    if (a.g.seq !== undefined) return -1;
    if (b.g.seq !== undefined) return 1;
    return (a.repDate || "").localeCompare(b.repDate || "");
  });

  return items.map((item, idx) => {
    const g = item.g;
    const paid = g.cash + g.transfer + g.platform;
    // Month name always comes from the due date (the charge), never from
    // when it happened to get paid. Only fall back to the payment date
    // when there's no charge at all in this group (an orphan payment).
    const monthDate = g.chargeDate || g.payDates.slice().sort()[0] || "";
    const lastPayDate = g.payDates.slice().sort().slice(-1)[0] || "";
    const label = g.seq !== undefined
      ? `${ordinalMonthLabel(g.seq - 1)}${monthDate ? ` (${monthLabelAr(monthDate.slice(0, 7))})` : ""}`
      : `${ordinalMonthLabel(idx)}${monthDate ? ` (${monthLabelAr(monthDate.slice(0, 7))})` : ""}`;
    return {
      ym: item.key,
      label,
      cash: g.cash,
      transfer: g.transfer,
      platform: g.platform,
      receipts: g.receipts.join("، "),
      date: lastPayDate || monthDate,
      remaining: Math.round((g.charge - paid) * 100) / 100,
    };
  });
}

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 9);
}

function photoKey(roomId, kind) {
  return `hijaz-photo-${roomId}-${kind}`;
}

async function loadPhoto(roomId, kind) {
  try {
    const res = await storage.get(photoKey(roomId, kind));
    return res && res.value ? res.value : null;
  } catch (e) {
    return null;
  }
}

async function savePhoto(roomId, kind, dataUrl) {
  try {
    await storage.set(photoKey(roomId, kind), dataUrl);
  } catch (e) {
    // best effort
  }
}

function compressImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function emptyTenant() {

}

  return {
    id: uid(buildingId),
    room: "",

    tenant: emptyTenant(),
    balance: 0,
    lastPaymentDate: "",
    payments: [],
    history: [],
  };
}

function addMonths(dateStr, months) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, (m - 1) + months, d);
  const yy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  if (!y || !m || !d) return null;
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today0) / 86400000);
}

function normalizePhone(phone) {
  let p = (phone || "").replace(/[^0-9]/g, "");
  if (!p) return "";
  if (p.startsWith("00")) p = p.slice(2);
  if (p.startsWith("0")) p = p.slice(1);
  if (!p.startsWith("966")) p = "966" + p;
  return p;
}

function waLink(phone, message) {
  const p = normalizePhone(phone);
  if (!p) return null;
  return `https://wa.me/${p}?text=${encodeURIComponent(message)}`;
}

function reminderMessage(room) {
  const balance = getBalance(room);
  if (balance > 0) {
    return `السلام عليكم، تذكير بخصوص إيجار الوحدة ${room.room} — المبلغ المتبقي عليكم ${fmtMoney(balance)}. يرجى التواصل لتسديد المستحق. شكراً`;
  }
  return `السلام عليكم، تذكير بأن موعد استحقاق إيجار الوحدة ${room.room} قريب (${fmtDate(room.tenant.dueDate)}). شكراً`;
}

function xlsxCell(ws, col, row) {
  const c = ws[col + row];
  return c ? c.v : undefined;
}

function xlsxCellIsRed(ws, col, row) {
  const c = ws[col + row];
  if (!c || !c.s || !c.s.fgColor) return false;
  const rgb = (c.s.fgColor.rgb || "").toUpperCase();
  return rgb.endsWith("FF0000");
}

function parseMasterSheetGroups(ws) {
  if (!ws["!ref"]) return [];
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const maxRow = range.e.r + 1;
  const groups = [];
  let row = 6;
  while (row <= maxRow) {
    const bVal = xlsxCell(ws, "B", row);
    if (bVal !== undefined && bVal !== null && String(bVal).trim() !== "") {
      if (String(bVal).includes("إجمالي")) break;
      const rows = [row];
      let r2 = row + 1;
      while (r2 <= maxRow) {
        const b2 = xlsxCell(ws, "B", r2);
        if (b2 !== undefined && b2 !== null && String(b2).trim() !== "") break;
        const c2 = xlsxCell(ws, "C", r2);
        if (c2 && String(c2).includes("إجمالي")) break;
        rows.push(r2);
        r2++;
      }
      groups.push({ room: String(bVal).trim(), rows });
      row = r2;
    } else {
      const cVal = xlsxCell(ws, "C", row);
      if (cVal && String(cVal).includes("إجمالي")) break;
      row++;
    }
  }
  return groups;
}

function xlsxDateStr(ws, col, row) {
  const c = ws[col + row];
  if (!c) return "";
  const v = c.v;
  if (v instanceof Date) {
    // The date library can hand back an instant a little off from exact
    // midnight (e.g. 2026-05-31T20:59:08Z instead of 2026-06-01T00:00:00Z)
    // — close enough that which getter (local/UTC) we use doesn't fix it.
    // Rounding to the nearest UTC day boundary absorbs that small offset
    // reliably, regardless of its size or direction (up to ~12h).
    const dayMs = 24 * 60 * 60 * 1000;
    const rounded = new Date(Math.round(v.getTime() / dayMs) * dayMs);
    const yy = rounded.getUTCFullYear();
    const mm = String(rounded.getUTCMonth() + 1).padStart(2, "0");
    const dd = String(rounded.getUTCDate()).padStart(2, "0");
    return `${yy}-${mm}-${dd}`;
  }
  return "";
}

function detectArchiveYear(ws0) {
  const a1 = ws0 && ws0["A1"] ? String(ws0["A1"].v || "") : "";
  const m = a1.match(/(20\d{2})/);
  return m ? m[1] : null;
}

function clampToArchiveStart(dateStr, archiveStart) {
  if (!dateStr) return dateStr;
  const start = archiveStart || "2026-01-01";
  if (dateStr >= start) return dateStr;
  // Keep the tenant's own due-day (e.g. the 26th) instead of collapsing
  // to the 1st of the archive month — otherwise their future automatic
  // monthly accrual would silently shift to the wrong day going forward.
  const day = parseInt(dateStr.slice(8, 10), 10) || 1;
  let candidate = setDayOfMonth(start, day);
  if (candidate < start) candidate = setDayOfMonth(addMonths(start, 1), day);
  return candidate;
}

const XLSX_MONTH_BLOCKS = [
  ["L", "M", "N", "O", "P", "Q"], ["R", "S", "T", "U", "V", "W"], ["X", "Y", "Z", "AA", "AB", "AC"],
  ["AD", "AE", "AF", "AG", "AH", "AI"], ["AJ", "AK", "AL", "AM", "AN", "AO"], ["AP", "AQ", "AR", "AS", "AT", "AU"],
  ["AV", "AW", "AX", "AY", "AZ", "BA"], ["BB", "BC", "BD", "BE", "BF", "BG"],
];

function setDayOfMonth(dateStr, day) {
  if (!dateStr || !day) return dateStr;
  const [y, m] = dateStr.split("-").map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const d = Math.min(day, lastDay);
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function extractMonthlyRecords(ws, row, moveInDate, dueDay, archiveStart, today) {
  if (!moveInDate) return [];
  const anchor = archiveStart || "2026-01-01";
  const records = XLSX_MONTH_BLOCKS.map(([cashCol, transferCol, platformCol, receiptCol, dateCol, remainingCol], idx) => {
    const cash = Number(xlsxCell(ws, cashCol, row)) || 0;
    const transfer = Number(xlsxCell(ws, transferCol, row)) || 0;
    const platform = Number(xlsxCell(ws, platformCol, row)) || 0;
    const receiptRaw = xlsxCell(ws, receiptCol, row);
    let receipt = receiptRaw !== undefined && receiptRaw !== null ? String(receiptRaw).trim() : "";
    if (receipt.includes("مجموع")) receipt = "دفعة مجمّعة";
    const paymentDateStr = xlsxDateStr(ws, dateCol, row);
    const total = cash + transfer + platform;
    // Only real recorded payment evidence should count. The "remaining"
    // column is usually a live formula (rent − paid) that keeps showing
    // the full rent for every row, even months that haven't happened
    // yet — it is NOT proof the month is actually due already.
    const hasPaymentEvidence = total > 0 || !!receipt;

    // Block #(idx+1) is a FIXED calendar month of the archive year — block
    // 1 is always the archive year's first month (e.g. January 2026),
    // regardless of when the tenant actually moved in. Move-in date only
    // rules out months before the tenant was actually there.
    const dueDate = setDayOfMonth(addMonths(anchor, idx), dueDay);
    if (dueDate < moveInDate) return null; // tenant wasn't a tenant yet
    if (dueDate > today && !hasPaymentEvidence) return null; // future month, nothing recorded yet

    return {
      blockIndex: idx + 1, date: dueDate, paymentDate: paymentDateStr || dueDate,
      receipt, cash, transfer, platform, total,
    };
  });

  return records.filter(Boolean);
}

function resolveMasterGroup(ws, group) {
  const infos = group.rows.map((r) => {
    const nameRaw = xlsxCell(ws, "C", r);
    return {
      row: r,
      name: nameRaw !== undefined && nameRaw !== null ? String(nameRaw).trim() : "",
      idNumber: xlsxCell(ws, "D", r) !== undefined ? String(xlsxCell(ws, "D", r)) : "",
      phone: xlsxCell(ws, "E", r) !== undefined ? String(xlsxCell(ws, "E", r)) : "",
      contract: xlsxCell(ws, "F", r) !== undefined ? String(xlsxCell(ws, "F", r)) : "",
      dueDate: xlsxDateStr(ws, "G", r),
      rent: xlsxCell(ws, "H", r),
      // السعي (agency fee) — one-time, not recurring: amount paid, receipt
      // number, payment date. Read but kept completely separate from the
      // monthly rent charges/payments and from the balance calculation.
      agencyAmount: Number(xlsxCell(ws, "I", r)) || 0,
      agencyReceipt: xlsxCell(ws, "J", r) !== undefined && xlsxCell(ws, "J", r) !== null ? String(xlsxCell(ws, "J", r)).trim() : "",
      agencyDate: xlsxDateStr(ws, "K", r),
      red: xlsxCellIsRed(ws, "C", r),
    };
  });
  const nonRed = infos.filter((inf) => !inf.red && inf.name);
  const current = nonRed[0] || null;
  const history = infos.filter((inf) => inf.name && inf !== current);
  return { room: group.room, current, history };
}

function applyMasterGroupsToBuilding(ws, building, resolvedGroups, archiveStart) {
  let updated = 0;
  let historyAdded = 0;
  let paymentsAdded = 0;
  let chargesAdded = 0;
  resolvedGroups.forEach((rg) => {
    const room = building.rooms.find((r) => String(r.room).trim() === rg.room);
    if (!room) return;
    if (rg.current) {
      room.vacant = false;
      if (rg.current.name) room.tenant.name = rg.current.name;
      if (rg.current.idNumber) room.tenant.idNumber = rg.current.idNumber;
      if (rg.current.phone) room.tenant.phone = rg.current.phone;
      if (rg.current.contract) room.tenant.contract = rg.current.contract;
      if (rg.current.rent) room.tenant.rent = Number(rg.current.rent) || room.tenant.rent;
      if (rg.current.dueDate) room.tenant.moveInDate = rg.current.dueDate;
      updated++;

      // السعي (agency fee): a one-time record, not a recurring rent charge.
      // Stored separately on the tenant so it never enters getBalance() or
      // the monthly rent breakdown — it's purely a receipt to keep on file.
      if (rg.current.agencyAmount > 0 || rg.current.agencyReceipt) {
        room.tenant.agencyFee = {
          amount: rg.current.agencyAmount || 0,
          receipt: rg.current.agencyReceipt || "",
          date: rg.current.agencyDate || "",
        };
      }

      const rent = Number(rg.current.rent) || room.tenant.rent || 0;
      const dueDay = rg.current.dueDate ? parseInt(rg.current.dueDate.slice(8, 10), 10) : null;
      const today = todayStr();
      const monthRecords = extractMonthlyRecords(ws, rg.current.row, rg.current.dueDate, dueDay, archiveStart, today);
      if (monthRecords.length > 0) {
        if (!Array.isArray(room.payments)) room.payments = [];
        const existingReceipts = new Set(room.payments.filter((p) => p.type === "payment" && p.receipt).map((p) => p.receipt));
        const existingCharges = new Set(room.payments.filter((p) => p.type === "charge" && p.note === "استحقاق مستورد من إكسل").map((p) => `${p.monthSeq}|${p.date}|${p.amount}`));
        monthRecords.forEach((rec) => {
          const chargeSig = `${rec.blockIndex}|${rec.date}|${rent}`;
          if (rent > 0 && !existingCharges.has(chargeSig)) {
            room.payments.push({
              id: uid("chg"), type: "charge", amount: rent, date: rec.date, monthSeq: rec.blockIndex,
              note: "استحقاق مستورد من إكسل", createdAt: todayStr(),
            });
            existingCharges.add(chargeSig);
            chargesAdded++;
          }
          if (rec.total > 0 && !(rec.receipt && rec.receipt !== "دفعة مجمّعة" && existingReceipts.has(rec.receipt))) {
            room.payments.push({
              id: uid("pay"), type: "payment", date: rec.paymentDate, receipt: rec.receipt, monthSeq: rec.blockIndex,
              cash: rec.cash, transfer: rec.transfer, platform: rec.platform, total: rec.total,
              note: "مستورد من إكسل", createdAt: todayStr(),
            });
            if (rec.receipt && rec.receipt !== "دفعة مجمّعة") existingReceipts.add(rec.receipt);
            paymentsAdded++;
          }
        });
        room.openingBalance = 0;
        const lastImportedDate = monthRecords.map((r) => r.date).filter(Boolean).sort().slice(-1)[0];
        room.tenant.dueDate = lastImportedDate ? addMonths(lastImportedDate, 1) : clampToArchiveStart(rg.current.dueDate || room.tenant.dueDate, archiveStart);
      } else if (rg.current.dueDate) {
        room.tenant.dueDate = clampToArchiveStart(rg.current.dueDate, archiveStart);
      }
    } else {
      room.vacant = true;
    }
    if (!Array.isArray(room.history)) room.history = [];
    const existingNames = new Set(room.history.map((h) => (typeof h === "string" ? h : h.name || "").trim()));
    rg.history.forEach((h) => {
      if (!h.name || existingNames.has(h.name)) return;
      if (room.tenant.name && room.tenant.name.trim() === h.name) return;
      room.history.push({
        name: h.name, idNumber: h.idNumber || "", phone: h.phone || "", contract: h.contract || "",
        rent: h.rent || null, moveInDate: "", moveOutDate: "", finalBalance: null,
        note: "من ملف إكسل مستورد",
      });
      existingNames.add(h.name);
      historyAdded++;
    });
  });
  return { updated, historyAdded, paymentsAdded, chargesAdded };
}

function getBalance(room) {
  const opening = Number(room.openingBalance ?? room.balance) || 0;
  const charges = (room.payments || [])
    .filter((p) => p.type === "charge")
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const paid = (room.payments || [])
    .filter((p) => p.type === "payment")
    .reduce((s, p) => s + (Number(p.total) || 0), 0);
  return Math.round((opening + charges - paid) * 100) / 100;
}

function accrueRoomCharges(room, today) {
  if (room.vacant) return 0;
  const rent = Number(room.tenant.rent) || 0;
  let due = room.tenant.dueDate;
  if (!rent || !due) return 0;

  let probe = due;
  let needed = 0;
  let probeGuard = 0;
  while (probe && probe <= today && probeGuard < 2000) {
    needed++;
    probe = addMonths(probe, 1);
    probeGuard++;
  }
  if (needed === 0) return 0;
  if (needed > 60) {
    return -1;
  }

  let count = 0;
  while (due && due <= today) {
    const entry = {
      id: uid("chg"),
      type: "charge",
      amount: rent,
      date: due,
      note: "استحقاق شهري تلقائي",
      createdAt: today,
    };
    room.payments = [entry, ...(room.payments || [])];
    due = addMonths(due, 1);
    count++;
  }
  room.tenant.dueDate = due;
  return count;
}

function applyAutoAccrual(store) {
  const today = todayStr();
  let count = 0;
  const flagged = [];
  const next = structuredClone(store);
  for (const bId of ["building1", "building2"]) {
    if (!Array.isArray(next[bId].expenses)) next[bId].expenses = [];
    for (const room of next[bId].rooms) {
      if (room.openingBalance === undefined) room.openingBalance = room.balance || 0;
      if (Array.isArray(room.history)) {
        room.history = room.history.map((h) =>
          typeof h === "string"
            ? { name: h, idNumber: "", phone: "", contract: "", rent: null, moveInDate: "", moveOutDate: "", finalBalance: null, note: "من البيانات المستوردة" }
            : h
        );
      } else {
        room.history = [];
      }
      const added = accrueRoomCharges(room, today);
      if (added === -1) {
        flagged.push(`${next[bId].name} — وحدة ${room.room}`);
      } else {
        count += added;
      }
    }
  }
  return { store: next, count, flagged };
}

function StaffArrearsView({ buildings, onLogout, portfolioName }) {

    .sort((a, b) => b._balance - a._balance);

  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: BG, fontFamily: FONT, color: INK }}>
      <GlobalStyle />

          تسجيل خروج
        </button>

        {arrears.length === 0 ? (

        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

                  <div style={{ fontSize: 11.5, color: MUTED, marginTop: 3 }}>{r.buildingName} · وحدة {r.room}{r.tenant.phone ? ` · ${r.tenant.phone}` : ""}</div>
                </div>
                <div style={{ fontWeight: 900, fontSize: 15, color: DANGER }}>{fmtMoney(r._balance)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App({ onLogout, role, storageKey, portfolioId, portfolioName, onBackToPortfolios, rolesMap, onRolesChanged }) {
  // المالك صار عنده نفس صلاحيات الإدارة الكاملة (تعديل، دفع، حذف، استيراد، مسح).
  const readOnly = false;
  const [store, setStore] = useState(null);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [search, setSearch] = useState("");
  const [payModal, setPayModal] = useState(null); // { buildingId, roomId }
  const [editModal, setEditModal] = useState(null); // { buildingId, roomId, isNew }
  const [receiptsModal, setReceiptsModal] = useState(null); // { buildingId, roomId }
  const [historyModal, setHistoryModal] = useState(null); // { buildingId, roomId }
  const [deleteConfirm, setDeleteConfirm] = useState(null); // { buildingId, roomId, roomLabel }
  const [endTenancyModal, setEndTenancyModal] = useState(null); // { buildingId, roomId }
  const [statementModal, setStatementModal] = useState(null); // { buildingId, roomId }
  const [toast, setToast] = useState("");
  const [backupOverdue, setBackupOverdue] = useState(false);
  const [wipeConfirm, setWipeConfirm] = useState(false);

  const storeRef = useRef(null);
  const writeQueueRef = useRef(Promise.resolve());

  function persist(next) {
    storeRef.current = next;
    writeQueueRef.current = writeQueueRef.current
      .catch(() => {})
      .then(async () => {
        try {
          await storage.set(storageKey, JSON.stringify(next));
        } catch (e) {
          showToast("تعذّر الحفظ — تحقق من الاتصال بالإنترنت");
        }
      });
  }

  useEffect(() => {
    (async () => {
      let loaded;
      try {
        const res = await storage.get(storageKey);
        loaded = res && res.value ? JSON.parse(res.value) : SEED;
      } catch (e) {
        loaded = SEED;
      }
      const { store: accrued, count, flagged } = applyAutoAccrual(loaded);
      storeRef.current = accrued;
      setStore(accrued);
      setReady(true);
      if (count > 0) {
        persist(accrued);
        setTimeout(() => showToast(`تمت إضافة ${count} استحقاق شهري تلقائياً`), 300);
      }
      if (flagged && flagged.length > 0) {
        setTimeout(() => showToast(`تنبيه: تاريخ استحقاق غير منطقي بـ ${flagged.length} وحدة، راجعيها من "تعديل"`), 900);
      }
      try {
        const res = await storage.get(BACKUP_REMINDER_KEY);
        const lastBackup = res && res.value;
        if (!lastBackup) {
          setBackupOverdue(true);
        } else {
          const days = Math.round((new Date(todayStr()) - new Date(lastBackup)) / 86400000);
          if (days >= 7) setBackupOverdue(true);
        }
      } catch (e) {
        // ignore
      }
    })();
  }, []);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }

  function updateRoom(buildingId, roomId, updater) {
    const prev = storeRef.current;
    if (!prev) return;
    const next = structuredClone(prev);
    const rooms = next[buildingId].rooms;
    const idx = rooms.findIndex((r) => r.id === roomId);
    if (idx === -1) return;
    rooms[idx] = updater(rooms[idx]);
    setStore(next);
    persist(next);
  }

  function addRoom(buildingId, room) {
    const prev = storeRef.current;
    if (!prev) return;
    const next = structuredClone(prev);
    next[buildingId].rooms.push(room);
    setStore(next);
    persist(next);
  }

  function deleteRoom(buildingId, roomId) {
    const prev = storeRef.current;
    if (!prev) return;
    const next = structuredClone(prev);
    next[buildingId].rooms = next[buildingId].rooms.filter((r) => r.id !== roomId);
    setStore(next);
    persist(next);
  }

  function recordPayment(buildingId, roomId, payment) {
    updateRoom(buildingId, roomId, (room) => {
      const total = (Number(payment.cash) || 0) + (Number(payment.transfer) || 0) + (Number(payment.platform) || 0);
      const entry = { ...payment, id: uid("pay"), type: "payment", total, createdAt: todayStr() };
      room.payments = [entry, ...(room.payments || [])];
      room.lastPaymentDate = payment.date || todayStr();
      return room;
    });
  }

  function addCharge(buildingId, roomId, charge) {
    updateRoom(buildingId, roomId, (room) => {
      const amount = Number(charge.amount) || 0;
      const entry = { id: uid("chg"), type: "charge", amount, date: charge.date, note: charge.note, createdAt: todayStr() };
      room.payments = [entry, ...(room.payments || [])];
      return room;
    });
  }

  function updateReceiptEntry(buildingId, roomId, entryId, patch) {
    updateRoom(buildingId, roomId, (room) => {
      room.payments = (room.payments || []).map((p) => {
        if (p.id !== entryId) return p;
        const merged = { ...p, ...patch };
        if (merged.type === "payment") {
          merged.total = (Number(merged.cash) || 0) + (Number(merged.transfer) || 0) + (Number(merged.platform) || 0);
        }
        return merged;
      });
      return room;
    });
  }

  function deleteReceiptEntry(buildingId, roomId, entryId) {
    updateRoom(buildingId, roomId, (room) => {
      room.payments = (room.payments || []).filter((p) => p.id !== entryId);
      return room;
    });
  }

  function addReceiptRow(buildingId, roomId) {
    updateRoom(buildingId, roomId, (room) => {
      const entry = { id: uid("pay"), type: "payment", cash: 0, transfer: 0, platform: 0, total: 0, receipt: "", date: todayStr(), note: "", createdAt: todayStr() };
      room.payments = [entry, ...(room.payments || [])];
      return room;
    });
  }

  function endTenancy(buildingId, roomId, moveOutDate) {
    updateRoom(buildingId, roomId, (room) => {
      if (room.vacant || !room.tenant.name) return room;
      const finalBalance = getBalance(room);
      const archived = {
        name: room.tenant.name,
        idNumber: room.tenant.idNumber,
        phone: room.tenant.phone,
        contract: room.tenant.contract,
        rent: room.tenant.rent,
        moveInDate: room.tenant.moveInDate || "",
        moveOutDate: moveOutDate || todayStr(),
        finalBalance,
        note: "",
      };
      room.history = [archived, ...(room.history || [])];
      room.tenant = emptyTenant();
      room.vacant = true;
      room.balance = 0;
      room.openingBalance = 0;
      room.payments = [];
      room.lastPaymentDate = "";
      return room;
    });
  }

  function addExpense(buildingId, expense) {
    const prev = storeRef.current;
    if (!prev) return;
    const next = structuredClone(prev);
    const entry = {
      id: uid("exp"),
      description: expense.description || "",
      amount: Number(expense.amount) || 0,
      date: expense.date || todayStr(),
      note: expense.note || "",
      createdAt: todayStr(),
    };
    next[buildingId].expenses = [entry, ...(next[buildingId].expenses || [])];
    setStore(next);
    persist(next);
  }

  function deleteExpense(buildingId, expenseId) {
    const prev = storeRef.current;
    if (!prev) return;
    const next = structuredClone(prev);
    next[buildingId].expenses = (next[buildingId].expenses || []).filter((e) => e.id !== expenseId);
    setStore(next);
    persist(next);
  }

  function clearAutoCharges(buildingId, roomId) {
    updateRoom(buildingId, roomId, (room) => {
      room.payments = (room.payments || []).filter((p) => {
        if (p.type === "charge") return false;
        // Also drop payments that came from a previous Excel import (they
        // may carry stale/wrong dates from before a fix) — but keep any
        // receipt the user entered by hand.
        if (p.type === "payment" && p.note === "مستورد من إكسل") return false;
        return true;
      });
      // Also clear the stored due date and move-in date — otherwise a
      // leftover value from before the fix stays visible until the next
      // Excel import runs. A fresh import will set both correctly again.
      room.tenant.dueDate = "";
      room.tenant.moveInDate = "";
      return room;
    });
  }

  function resetOpeningBalance(buildingId, roomId) {
    updateRoom(buildingId, roomId, (room) => {
      room.openingBalance = 0;
      return room;
    });
  }

  function wipeAllFinancials() {
    const prev = storeRef.current;
    if (!prev) return;
    const next = structuredClone(prev);
    for (const bId of ["building1", "building2"]) {
      next[bId].rooms.forEach((room) => {
        // Full reset: clear the tenant entirely (name, dates, rent, ID,
        // contract...) in addition to payments/balance, so every unit
        // goes back to empty/vacant — ready for a clean Excel import
        // with no leftover data from any earlier, possibly-buggy import.
        room.tenant = emptyTenant();
        room.vacant = true;
        room.payments = [];
        room.openingBalance = 0;
        room.balance = 0;
        room.lastPaymentDate = "";
        room.history = [];
      });
    }
    storeRef.current = next;
    setStore(next);
    persist(next);
  }

  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `نسخة-احتياطية-عمارات-الحجاز-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("تم تنزيل النسخة الاحتياطية");
      storage.set(BACKUP_REMINDER_KEY, todayStr()).catch(() => {});
      setBackupOverdue(false);
    } catch (e) {
      showToast("تعذّر تنزيل النسخة");
    }
  }

  function exportExcel() {
    try {
      const unitsRows = [];
      const receiptsRows = [];
      const chargesRows = [];
      const expensesRows = [];
      const historyRows = [];

      for (const bId of ["building1", "building2"]) {
        const b = store[bId];
        b.rooms.forEach((r) => {
          unitsRows.push({
            "العمارة": b.name,
            "الوحدة": r.room,
            "الحالة": r.vacant ? "فارغة" : "مؤجرة",
            "المستأجر": r.tenant.name,
            "رقم الهوية": r.tenant.idNumber,
            "الجوال": r.tenant.phone,
            "رقم العقد": r.tenant.contract,
            "الإيجار الشهري": r.tenant.rent,
            "تاريخ الدخول": r.tenant.moveInDate,
            "تاريخ الاستحقاق القادم": r.tenant.dueDate,
            "تاريخ انتهاء العقد": r.tenant.contractEndDate,
            "المتبقي": getBalance(r),
          });
          (r.payments || []).forEach((p) => {
            if (p.type === "payment") {
              receiptsRows.push({
                "العمارة": b.name, "الوحدة": r.room, "المستأجر": r.tenant.name,
                "التاريخ": p.date, "رقم السند": p.receipt, "كاش": Number(p.cash) || 0,
                "حوالة": Number(p.transfer) || 0, "منصة": Number(p.platform) || 0, "الإجمالي": p.total,
              });
            } else {
              chargesRows.push({
                "العمارة": b.name, "الوحدة": r.room, "المستأجر": r.tenant.name,
                "التاريخ": p.date, "المبلغ": p.amount, "ملاحظة": p.note,
              });
            }
          });
          (r.history || []).forEach((h) => {
            historyRows.push({
              "العمارة": b.name, "الوحدة": r.room, "الاسم": h.name, "رقم الهوية": h.idNumber,
              "الجوال": h.phone, "رقم العقد": h.contract, "الإيجار": h.rent,
              "تاريخ الدخول": h.moveInDate, "تاريخ الخروج": h.moveOutDate,
              "المتبقي عند الخروج": h.finalBalance,
            });
          });

        (b.expenses || []).forEach((e) => {
          expensesRows.push({ "العمارة": b.name, "الوصف": e.description, "المبلغ": e.amount, "التاريخ": e.date });
        });

      const wb = XLSX.utils.book_new();
      wb.Workbook = { Views: [{ RTL: true }] };
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(unitsRows), "الوحدات");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(receiptsRows), "السندات");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(chargesRows), "الاستحقاقات");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expensesRows), "المصاريف");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(historyRows), "الساكنون السابقون");
      XLSX.writeFile(wb, `عمارات-الحجاز-${todayStr()}.xlsx`);

  async function exportRawTemplateExcel() {
    try {
      const yearStr = window.prompt("لأي سنة بدك تصدّري الملف؟ (مثال: 2026)", String(new Date().getFullYear()));
      if (!yearStr) return;
      const year = parseInt(yearStr, 10);
      if (!year) { showToast("سنة غير صحيحة"); return; }

      function toExcelDate(iso) {
        if (!iso) return "";
        const [y, m, d] = iso.split("-").map(Number);
        if (!y || !m || !d) return "";
        return new Date(y, m - 1, d);
      }

      function buildCurrentRow(room) {
        const row = new Array(11 + 48).fill("");
        row[0] = 1;
        row[1] = room.room;
        if (room.vacant || !room.tenant || !room.tenant.name) return row;
        const t = room.tenant;
        row[2] = t.name || "";
        row[3] = t.idNumber || "";
        row[4] = t.phone || "";
        row[5] = t.contract || "";
        row[6] = toExcelDate(t.moveInDate);
        row[7] = Number(t.rent) || 0;
        if (t.agencyFee) {
          row[8] = t.agencyFee.amount || "";
          row[9] = t.agencyFee.receipt || "";
          row[10] = toExcelDate(t.agencyFee.date);
        }
        const rent = Number(t.rent) || 0;
        const blocks = Array.from({ length: 8 }, () => ({ cash: 0, transfer: 0, platform: 0, receipt: "", date: "" }));
        (room.payments || []).forEach((p) => {
          if (!p.date) return;
          const [py, pm] = p.date.split("-").map(Number);
          if (py !== year || pm < 1 || pm > 8) return;
          const idx = pm - 1;
          if (p.type === "payment") {
            blocks[idx].cash += Number(p.cash) || 0;
            blocks[idx].transfer += Number(p.transfer) || 0;
            blocks[idx].platform += Number(p.platform) || 0;
            if (p.receipt) blocks[idx].receipt = p.receipt;
            blocks[idx].date = p.date;
          }
        });
        blocks.forEach((blk, i) => {
          const base = 11 + i * 6;
          const paid = blk.cash + blk.transfer + blk.platform;
          row[base] = blk.cash || "";
          row[base + 1] = blk.transfer || "";
          row[base + 2] = blk.platform || "";
          row[base + 3] = blk.receipt || "";
          row[base + 4] = blk.date ? toExcelDate(blk.date) : "";
          row[base + 5] = paid > 0 ? Math.max(rent - paid, 0) : "";
        });
        return row;
      }

      function buildHistoryRow(h) {
        const row = new Array(11 + 48).fill("");
        row[2] = h.name || "";
        row[3] = h.idNumber || "";
        row[4] = h.phone || "";
        row[5] = h.contract || "";
        row[6] = toExcelDate(h.moveInDate);
        row[7] = Number(h.rent) || 0;
        return row;
      }

      // كل صف مع علامة إذا هو "مستأجر سابق" (لازم يطلع أحمر، متل الملف الأصلي)، وعلامة العمارة/الدور
      const dataRows = []; // { values, isHistory, buildingIdx, floor }
      ["building1", "building2"].forEach((bId, bIdx) => {
        const b = store[bId];
        b.rooms.forEach((room) => {
          const floor = Math.floor((parseInt(String(room.room).replace(/\D.*$/, ""), 10) || 0) / 100);
          dataRows.push({ values: buildCurrentRow(room), isHistory: false, buildingIdx: bIdx, floor });
          (room.history || []).forEach((h) => dataRows.push({ values: buildHistoryRow(h), isHistory: true, buildingIdx: bIdx, floor }));
        });
      });

      // ألوان مطابقة تماماً لنسق الملف الأصلي (مستخرجة من نفس التدرجات
      // اللي إكسل نفسه بيعرضها بمنتقي الألوان: تدرجات فاتحة/غامقة لكل لون أساسي)
      const HEADER_TENANT_COLOR = "FBE5D6"; // عمود الغرفة + قسم اسم المستأجر
      const HEADER_AGENCY_COLOR = "F1F0F0"; // قسم السعي
      const HEADER_MONTH_COLOR = "4472C4";  // عناوين الأشهر (أزرق) — نص أبيض فوقه
      const FLOOR_COLORS = [
        ["4472C4", "ED7D31", "70AD47", "B25E25"], // العمارة الأولى: دور1-4
        ["F1F0F0", "FFD966", "333F50", "B4C7E7"], // العمارة الثانية: دور1-4
      ];
      function floorColorFor(buildingIdx, floor) {
        const palette = FLOOR_COLORS[buildingIdx] || FLOOR_COLORS[0];
        const idx = Math.max(0, floor - 1) % palette.length;
        return palette[idx];
      }
      function fillCell(cell, hex, whiteText) {
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + hex } };
        if (whiteText) cell.font = { ...(cell.font || {}), color: { argb: "FFFFFFFF" } };
      }

      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet("Sheet1", { views: [{ rightToLeft: true }] });

      // صف العنوان (١-٣ مدموجة)
      sheet.mergeCells("A1:Q3");
      sheet.getCell("A1").value = `${portfolioName || "عقارك"} ${year}`;
      sheet.getCell("A1").font = { bold: true, size: 16 };

      // صف ٤: عناوين المجموعات المدموجة (نفس ترتيب الأصل بالظبط)
      const groupHeaderSpecs = [
        { range: "A4:B5", label: "الغرفة", color: HEADER_TENANT_COLOR },
        { range: "C4:H4", label: "اسم المستأجر", color: HEADER_TENANT_COLOR },
        { range: "I4:K4", label: "السعي", color: HEADER_AGENCY_COLOR },
      ];
      for (let i = 0; i < 8; i++) {
        const base = 12 + i * 6; // 1-indexed start column of block i
        const startCol = sheet.getColumn(base).letter;
        const endCol = sheet.getColumn(base + 5).letter;
        groupHeaderSpecs.push({ range: `${startCol}4:${endCol}4`, label: `الشهر ${["الاول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن"][i]}`, color: HEADER_MONTH_COLOR, white: true });
      }
      groupHeaderSpecs.forEach((spec) => {
        sheet.mergeCells(spec.range);
        const topLeft = spec.range.split(":")[0];
        const cell = sheet.getCell(topLeft);
        cell.value = spec.label;
        cell.alignment = { horizontal: "center", vertical: "middle" };
        cell.font = { bold: true, color: { argb: spec.white ? "FFFFFFFF" : "FF000000" } };
        fillCell(cell, spec.color, false);
      });

      // صف ٥: العناوين التفصيلية
      const subHeaderRow = sheet.getRow(5);
      const subHeaders = ["", "", "اسم المستأجر", "رقم البطاقة", "الجوال", "رقم العقد", "تاريخ الايجار", "القيمة الايجارية", "المبلغ", "السند", "تاريخة"];
      for (let i = 1; i <= 8; i++) subHeaders.push("المبلغ كاش", "المبلغ حوالة", "المبلغ منصة", "السند", "تاريخه", "متبقي");
      subHeaders.forEach((v, i0) => {
        if (!v) return;
        const colNum = i0 + 1;
        const cell = subHeaderRow.getCell(colNum);
        cell.value = v;
        cell.font = { bold: true };
        cell.alignment = { horizontal: "center", vertical: "middle" };
        const color = colNum <= 8 ? HEADER_TENANT_COLOR : colNum <= 11 ? HEADER_AGENCY_COLOR : HEADER_MONTH_COLOR;
        fillCell(cell, color, colNum > 11);
      });

      const dateCols = [7]; // G = تاريخ الإيجار
      for (let i = 0; i < 8; i++) dateCols.push(12 + i * 6 + 4); // عمود التاريخ بكل شهر (1-indexed)

      dataRows.forEach(({ values, isHistory, buildingIdx, floor }) => {
        const row = sheet.addRow(values);
        const bColor = floorColorFor(buildingIdx, floor);
        row.getCell(2).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + bColor } };
        if (isHistory) {
          [3, 4, 5, 6].forEach((colNum) => {
            row.getCell(colNum).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFF0000" } };
          });
        }
        dateCols.forEach((colNum) => {
          const cell = row.getCell(colNum);
          if (cell.value instanceof Date) cell.numFmt = "yyyy-mm-dd";
        });
      });

      for (let i = 1; i <= 59; i++) sheet.getColumn(i).width = i <= 11 ? 14 : 11;

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `عمارات-الحجاز-${year}-نسخة-الاستيراد.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("تم تحميل ملف الإكسل بنفس تنسيق الاستيراد");
    } catch (e) {
      console.error("exportRawTemplateExcel failed:", e);
      showToast("تعذّر تحميل الملف");
    }
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.building1 || !parsed.building2) throw new Error("bad format");
        storeRef.current = parsed;
        setStore(parsed);
        persist(parsed);
        showToast("تم استيراد النسخة بنجاح");
      } catch (err) {
        showToast("الملف غير صالح، تأكد إنه نفس نوع النسخة الاحتياطية");
      }
    };
    reader.readAsText(file);
  }

  function importExcel(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array", cellStyles: true, cellDates: true });
        const prev = storeRef.current;
        if (!prev) return;
        const next = structuredClone(prev);
        let updated = 0;
        let historyAdded = 0;

        const ws0 = wb.Sheets[wb.SheetNames[0]];
        const looksLikeMasterSheet = ws0 && ws0["A4"] && String(ws0["A4"].v || "").includes("الغرفة");

        if (looksLikeMasterSheet) {
          const archiveYear = detectArchiveYear(ws0);
          const archiveStart = archiveYear ? `${archiveYear}-01-01` : "2026-01-01";
          const groups = parseMasterSheetGroups(ws0);
          const resolved = groups.map((g) => resolveMasterGroup(ws0, g));
          const splitIdxs = [];
          resolved.forEach((rg, i) => { if (/^101(\D|$)/.test(rg.room)) splitIdxs.push(i); });
          let b1Groups = resolved;
          let b2Groups = [];
          if (splitIdxs.length >= 2) {
            b1Groups = resolved.slice(splitIdxs[0], splitIdxs[1]);
            b2Groups = resolved.slice(splitIdxs[1]);
          }
          const r1 = applyMasterGroupsToBuilding(ws0, next.building1, b1Groups, archiveStart);
          const r2 = applyMasterGroupsToBuilding(ws0, next.building2, b2Groups, archiveStart);
          updated = r1.updated + r2.updated;
          historyAdded = r1.historyAdded + r2.historyAdded;
          const paymentsAdded = r1.paymentsAdded + r2.paymentsAdded;
          const chargesAdded = r1.chargesAdded + r2.chargesAdded;
          storeRef.current = next;
          setStore(next);
          persist(next);
          const parts = [];
          if (updated > 0) parts.push(`تحديث ${updated} وحدة`);
          if (historyAdded > 0) parts.push(`إضافة ${historyAdded} ساكن سابق`);
          if (paymentsAdded > 0) parts.push(`${paymentsAdded} سند دفع`);
          if (chargesAdded > 0) parts.push(`${chargesAdded} استحقاق`);
          showToast(parts.length ? `تم استيراد: ${parts.join("، ")}` : "لم يتم العثور على بيانات مطابقة بالملف");
          return;
        }

        if (wb.SheetNames.includes("الوحدات")) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets["الوحدات"]);
          for (const bId of ["building1", "building2"]) {
            const bName = next[bId].name;
            next[bId].rooms.forEach((room) => {
              const match = rows.find((row) =>
                row["الوحدة"] !== undefined &&
                String(row["الوحدة"]).trim() === String(room.room).trim() &&
                (!row["العمارة"] || String(row["العمارة"]).trim() === bName)
              );
              if (match) {
                if (match["المستأجر"] !== undefined) room.tenant.name = String(match["المستأجر"] || "");
                if (match["رقم الهوية"] !== undefined) room.tenant.idNumber = String(match["رقم الهوية"] || "");
                if (match["الجوال"] !== undefined) room.tenant.phone = String(match["الجوال"] || "");
                if (match["رقم العقد"] !== undefined) room.tenant.contract = String(match["رقم العقد"] || "");
                // Only overwrite the rent if the imported value is a real,
                // positive number. A blank/0 cell in the sheet must NOT
                // zero out the tenant's rent — that silently disables all
                // future automatic monthly accrual for the unit, even
                // while the tenant is still there and owes rent.
                const importedRent = Number(match["الإيجار الشهري"]);
                if (match["الإيجار الشهري"] !== undefined && importedRent > 0) room.tenant.rent = importedRent;
                if (match["الحالة"] !== undefined) room.vacant = String(match["الحالة"]).includes("فارغ");
                updated++;
              }
            });
          }
        }

        const histSheetName = wb.SheetNames.find((n) => n.includes("الساكنون_السابقون") || n.includes("الساكنون السابقون"));
        if (histSheetName) {
          const histRows = XLSX.utils.sheet_to_json(wb.Sheets[histSheetName]);
          for (const bId of ["building1", "building2"]) {
            const bName = next[bId].name;
            next[bId].rooms.forEach((room) => {
              const entriesForRoom = histRows.filter((row) =>
                row["الوحدة"] !== undefined &&
                String(row["الوحدة"]).trim() === String(room.room).trim() &&
                (!row["العمارة"] || String(row["العمارة"]).trim() === bName)
              );
              if (!Array.isArray(room.history)) room.history = [];
              const existingNames = new Set(room.history.map((h) => (typeof h === "string" ? h : h.name || "").trim()));
              entriesForRoom.forEach((row) => {
                const name = String(row["الاسم"] || "").trim();
                if (!name || existingNames.has(name)) return;
                if (room.tenant && room.tenant.name && room.tenant.name.trim() === name) return;
                room.history.push({
                  name,
                  idNumber: String(row["رقم الهوية"] || ""),
                  phone: String(row["الجوال"] || ""),
                  contract: String(row["رقم العقد"] || ""),
                  rent: row["الإيجار"] || null,
                  moveInDate: "", moveOutDate: "", finalBalance: null,
                  note: "من ملف إكسل مستورد",
                });
                existingNames.add(name);
                historyAdded++;
              });
            });
          }
        }

        storeRef.current = next;
        setStore(next);
        persist(next);
        const parts = [];
        if (updated > 0) parts.push(`تحديث ${updated} وحدة`);
        if (historyAdded > 0) parts.push(`إضافة ${historyAdded} ساكن سابق`);
        showToast(parts.length ? `تم ${parts.join(" و")}` : "لم يتم العثور على بيانات مطابقة بالملف");
      } catch (err) {
        showToast("تعذّر قراءة ملف الإكسل — تأكدي من الصيغة");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  if (!store) {
    return (
      <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT }}>
        <div style={{ color: INK, fontSize: 15 }}>...جاري التحميل</div>
      </div>
    );
  }

  const buildings = [
    { id: "building1", data: store.building1 },
    { id: "building2", data: store.building2 },
  ];

  if (role === "staff") {
    return <StaffArrearsView buildings={buildings} onLogout={onLogout} portfolioName={portfolioName} />;
  }

  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: BG, fontFamily: FONT, color: INK }}>
      <GlobalStyle />
      {onBackToPortfolios && (
        <div style={{ background: "#12312D", padding: "8px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={onBackToPortfolios} style={{ background: "none", border: "none", color: "#C9CFC7", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
            › رجوع لقائمة العملاء
          </button>
          {portfolioName && <div style={{ color: "#fff", fontSize: 12, fontWeight: 700 }}>{portfolioName}</div>}
        </div>
      )}
      <TopBar tab={tab} setTab={setTab} onExport={exportBackup} onImportFile={importBackup} onLogout={onLogout} onExportExcel={exportExcel} onExportRawExcel={exportRawTemplateExcel} onImportExcel={importExcel} onWipeAll={() => setWipeConfirm(true)} readOnly={readOnly} canManageUsers={role === "admin" || role === "owner"} portfolioName={portfolioName} />
      <div style={{ maxWidth: 980, margin: "0 auto", padding: "18px 16px 60px" }}>
        {tab === "dashboard" && (
          <Dashboard buildings={buildings} onGo={(t) => setTab(t)} backupOverdue={backupOverdue} onExportBackup={exportBackup} />
        )}
        {(tab === "building1" || tab === "building2") && (
          <BuildingView
            buildingId={tab}
            building={store[tab]}
            search={search}
            setSearch={setSearch}
            onPay={(roomId) => setPayModal({ buildingId: tab, roomId })}
            onEdit={(roomId, isNew) => setEditModal({ buildingId: tab, roomId, isNew })}
            onReceipts={(roomId) => setReceiptsModal({ buildingId: tab, roomId })}
            onHistory={(roomId) => setHistoryModal({ buildingId: tab, roomId })}
            onQuickEndTenancy={(roomId) => setEndTenancyModal({ buildingId: tab, roomId })}
            onStatement={(roomId) => setStatementModal({ buildingId: tab, roomId })}
            onAddRoom={() => {
              const room = emptyRoom(tab);
              addRoom(tab, room);
              setEditModal({ buildingId: tab, roomId: room.id, isNew: true });
            }}
            onDelete={(roomId) => {
              const room = store[tab].rooms.find((r) => r.id === roomId);
              setDeleteConfirm({ buildingId: tab, roomId, roomLabel: room ? room.room : "" });
            }}
            readOnly={readOnly}
          />
        )}
        {tab === "reports" && <Reports buildings={buildings} />}
        {tab === "expenses" && <ExpensesView buildings={buildings} onAddExpense={addExpense} onDeleteExpense={deleteExpense} readOnly={readOnly} />}
        {tab === "collection" && <CollectionView buildings={buildings} onPay={(buildingId, roomId) => setPayModal({ buildingId, roomId })} readOnly={readOnly} />}
        {tab === "users" && (role === "admin" || role === "owner") && (
          <UsersView portfolioId={portfolioId} rolesMap={rolesMap} onRolesChanged={onRolesChanged} />
        )}
      </div>

      {payModal && (
        <PayModal
          room={store[payModal.buildingId].rooms.find((r) => r.id === payModal.roomId)}
          onClose={() => setPayModal(null)}
          onSubmitPayment={(p) => {
            recordPayment(payModal.buildingId, payModal.roomId, p);
            showToast("تم تسجيل الدفعة");
            setPayModal(null);
          }}
          onSubmitCharge={(c) => {
            addCharge(payModal.buildingId, payModal.roomId, c);
            showToast("تم إضافة الاستحقاق");
            setPayModal(null);
          }}
        />
      )}

      {editModal && (
        <EditModal
          room={store[editModal.buildingId].rooms.find((r) => r.id === editModal.roomId)}
          isNew={editModal.isNew}
          onClose={() => setEditModal(null)}
          onSave={(patch) => {
            updateRoom(editModal.buildingId, editModal.roomId, (room) => {
              // Normalize both sides (missing field vs empty string) before
              // comparing — otherwise saving the edit form with the move-in
              // date untouched (very common for older tenants who never had
              // this field stored) is misread as a real change, which wipes
              // every charge on the unit, imported history included.
              const prevMoveIn = room.tenant.moveInDate || "";
              const nextMoveIn = (patch.tenant && patch.tenant.moveInDate) || "";
              const moveInChanged = prevMoveIn !== nextMoveIn;
              const merged = { ...room, ...patch };
              if (moveInChanged) {
                merged.payments = (merged.payments || []).filter((p) => p.type !== "charge");
              }
              const addedCount = accrueRoomCharges(merged, todayStr());
              if (addedCount > 0) {
                setTimeout(() => showToast(`تمت إضافة ${addedCount} استحقاق شهري تلقائياً`), 300);
              } else if (addedCount === -1) {
                setTimeout(() => showToast('تاريخ الاستحقاق يبدو غير صحيح (بعيد جداً) — تأكدي منه'), 300);
              }
              return merged;
            });
            showToast("تم حفظ البيانات");
            setEditModal(null);
          }}
          onEndTenancy={(moveOutDate) => {
            endTenancy(editModal.buildingId, editModal.roomId, moveOutDate);
            showToast("تم تسجيل مغادرة المستأجر");
            setEditModal(null);
          }}
        />
      )}

      {receiptsModal && (
        <ReceiptsModal
          room={store[receiptsModal.buildingId].rooms.find((r) => r.id === receiptsModal.roomId)}
          onClose={() => setReceiptsModal(null)}
          onAddRow={(payment) => {
            recordPayment(receiptsModal.buildingId, receiptsModal.roomId, payment);
            showToast("تم حفظ السند");
          }}
          onUpdateRow={(entryId, patch) => updateReceiptEntry(receiptsModal.buildingId, receiptsModal.roomId, entryId, patch)}
          onDeleteRow={(entryId) => {
            deleteReceiptEntry(receiptsModal.buildingId, receiptsModal.roomId, entryId);
            showToast("تم حذف السند");
          }}
          onClearCharges={() => {
            clearAutoCharges(receiptsModal.buildingId, receiptsModal.roomId);
            showToast("تم مسح كل الاستحقاقات التلقائية");
          }}
          onResetOpening={() => {
            resetOpeningBalance(receiptsModal.buildingId, receiptsModal.roomId);
            showToast("تم تصفير الرصيد الافتتاحي");
          }}
          readOnly={readOnly}
        />
      )}

      {historyModal && (
        <HistoryModal
          room={store[historyModal.buildingId].rooms.find((r) => r.id === historyModal.roomId)}
          onClose={() => setHistoryModal(null)}
        />
      )}

      {deleteConfirm && (
        <ConfirmModal
          title="حذف الوحدة"
          message={`متأكدة إنك بدك تحذفي وحدة ${deleteConfirm.roomLabel} نهائياً؟ هاد الإجراء ما ينرجع.`}
          confirmLabel="حذف نهائياً"
          onConfirm={() => {
            deleteRoom(deleteConfirm.buildingId, deleteConfirm.roomId);
            showToast("تم حذف الوحدة");
            setDeleteConfirm(null);
          }}
          onCancel={() => setDeleteConfirm(null)}
        />
      )}

      {wipeConfirm && (
        <WipeConfirmModal
          onConfirm={() => {
            wipeAllFinancials();
            showToast("تم مسح كل البيانات");
            setWipeConfirm(false);
          }}
          onCancel={() => setWipeConfirm(false)}
        />
      )}

      {endTenancyModal && (
        <EndTenancyModal
          room={store[endTenancyModal.buildingId].rooms.find((r) => r.id === endTenancyModal.roomId)}
          onClose={() => setEndTenancyModal(null)}
          onConfirm={(moveOutDate) => {
            endTenancy(endTenancyModal.buildingId, endTenancyModal.roomId, moveOutDate);
            showToast("تم إخراج المستأجر ونقله لسجل الساكنين السابقين");
            setEndTenancyModal(null);
          }}
        />
      )}

      {statementModal && (
        <StatementModal
          room={store[statementModal.buildingId].rooms.find((r) => r.id === statementModal.roomId)}
          buildingName={store[statementModal.buildingId].name}
          onClose={() => setStatementModal(null)}
        />
      )}

      {toast && <Toast msg={toast} />}
    </div>
  );
}

const PRIMARY_DARK = "#12312D";

const DANGER = "#A6402F";

const BORDER = "#E4DBC8";

function GlobalStyle() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
      * { box-sizing: border-box; }
      body { margin: 0; }
      input, select, textarea { font-family: ${FONT}; }
      button { font-family: ${FONT}; cursor: pointer; }
      ::placeholder { color: #A79C8C; }
      @media print {
        body * { visibility: hidden; }
        .print-statement, .print-statement * { visibility: visible; }
        .print-statement { position: absolute; top: 0; left: 0; width: 100%; }
        .no-print { display: none !important; }
      }
    `}</style>
  );
}
